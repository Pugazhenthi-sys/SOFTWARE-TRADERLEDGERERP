<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TradeLedger ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg-deep:#0B1420;
  --bg-panel:#121D2E;
  --bg-panel-alt:#182840;
  --accent-teal:#14B8A6;
  --accent-teal-dim:#0F766E;
  --accent-amber:#F5A524;
  --accent-rose:#F43F5E;
  --accent-green:#22C55E;
  --text-primary:#E7EDF3;
  --text-muted:#8AA0B8;
  --border:#223349;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg-deep);color:var(--text-primary);font-family:'Inter',sans-serif;}
#root{min-height:100vh;}
.font-display{font-family:'Space Grotesk',sans-serif;}
.font-mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg-deep);}
::-webkit-scrollbar-thumb{background:var(--bg-panel-alt);border-radius:6px;}
a{color:var(--accent-teal);text-decoration:none;}
button{font-family:inherit;}
input,select,textarea{
  background:var(--bg-deep)!important;color:var(--text-primary)!important;
  border:1px solid var(--border)!important;border-radius:8px!important;
}
input:focus,select:focus,textarea:focus{
  outline:none!important;border-color:var(--accent-teal)!important;
  box-shadow:0 0 0 3px rgba(20,184,166,0.15)!important;
}
input::placeholder{color:var(--text-muted);}
.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:240px;flex-shrink:0;background:var(--bg-panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:22px 20px 18px;border-bottom:1px solid var(--border);}
.brand-mark{
  width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--accent-teal),var(--accent-teal-dim));
  display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Space Grotesk',sans-serif;color:#04201C;
}
.nav-section{padding:14px 10px;overflow-y:auto;flex:1;}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);padding:12px 12px 6px;}
.nav-link{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--text-muted);
  cursor:pointer;font-size:14px;font-weight:500;margin-bottom:2px;transition:background .15s,color .15s;
}
.nav-link:hover{background:var(--bg-panel-alt);color:var(--text-primary);}
.nav-link.active{background:rgba(20,184,166,0.12);color:var(--accent-teal);}
.nav-icon{width:18px;text-align:center;font-size:15px;}
.main-area{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:60px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;padding:0 24px;background:rgba(11,20,32,0.7);backdrop-filter:blur(6px);
  position:sticky;top:0;z-index:10;
}
.page-content{padding:24px;max-width:1400px;width:100%;margin:0 auto;}
.card{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);}
.card-pad{padding:18px 20px;}
.stat-card{
  background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;position:relative;overflow:hidden;
}
.stat-card .accent-bar{position:absolute;left:0;top:0;bottom:0;width:3px;}
.stat-label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.stat-value{font-size:24px;font-weight:700;margin-top:6px;font-family:'JetBrains Mono',monospace;}
.btn-teal{
  background:var(--accent-teal);color:#04201C;border:none;border-radius:8px;padding:9px 16px;
  font-weight:600;font-size:14px;cursor:pointer;transition:filter .15s;
}
.btn-teal:hover{filter:brightness(1.1);}
.btn-outline{
  background:transparent;color:var(--text-primary);border:1px solid var(--border);border-radius:8px;
  padding:9px 16px;font-weight:500;font-size:14px;cursor:pointer;transition:background .15s;
}
.btn-outline:hover{background:var(--bg-panel-alt);}
.btn-danger{
  background:rgba(244,63,94,0.12);color:var(--accent-rose);border:1px solid rgba(244,63,94,0.3);
  border-radius:8px;padding:7px 12px;font-weight:500;font-size:13px;cursor:pointer;
}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:7px;}
table.tl-table{width:100%;border-collapse:collapse;font-size:13.5px;}
table.tl-table th{
  text-align:left;padding:10px 12px;color:var(--text-muted);font-weight:600;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap;
}
table.tl-table td{padding:11px 12px;border-bottom:1px solid rgba(34,51,73,0.5);vertical-align:middle;}
table.tl-table tr:hover td{background:rgba(255,255,255,0.02);}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
.badge-teal{background:rgba(20,184,166,0.15);color:var(--accent-teal);}
.badge-amber{background:rgba(245,165,36,0.15);color:var(--accent-amber);}
.badge-rose{background:rgba(244,63,94,0.15);color:var(--accent-rose);}
.badge-green{background:rgba(34,197,94,0.15);color:var(--accent-green);}
.modal-backdrop-tl{
  position:fixed;inset:0;background:rgba(5,10,17,0.7);display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:20px;
}
.modal-box{
  background:var(--bg-panel);border:1px solid var(--border);border-radius:14px;width:100%;
  max-width:520px;max-height:88vh;overflow-y:auto;padding:22px 24px;
}
.form-label{font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:5px;display:block;}
.form-group{margin-bottom:13px;}
.form-control-tl{width:100%;padding:9px 11px;font-size:14px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.tabs-tl{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;}
.tab-tl{padding:10px 16px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text-muted);border-bottom:2px solid transparent;}
.tab-tl.active{color:var(--accent-teal);border-bottom-color:var(--accent-teal);}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted);}
.spinner{
  width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--accent-teal);
  border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.toast-tl{
  position:fixed;bottom:22px;right:22px;background:var(--bg-panel-alt);border:1px solid var(--border);
  padding:13px 18px;border-radius:10px;z-index:2000;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);
  min-width:240px;
}
.toast-tl.success{border-left:3px solid var(--accent-green);}
.toast-tl.error{border-left:3px solid var(--accent-rose);}
.auth-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;background:
    radial-gradient(circle at 20% 20%, rgba(20,184,166,0.10), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(245,165,36,0.08), transparent 40%),
    var(--bg-deep);
  padding:20px;
}
.auth-card{width:100%;max-width:400px;background:var(--bg-panel);border:1px solid var(--border);border-radius:16px;padding:32px 30px;}
.grain-rule{height:1px;background:repeating-linear-gradient(90deg,var(--border) 0 6px,transparent 6px 10px);margin:16px 0;}
@media (max-width:820px){
  .sidebar{position:fixed;left:-240px;transition:left .2s;z-index:100;}
  .sidebar.open{left:0;}
  .grid-2,.grid-3{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="app.js"></script>
</body>
</html>
